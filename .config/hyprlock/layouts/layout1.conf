source = ~/.config/hyprlock/colors.conf

$music = /home/ev/.config/hyprlock/scripts/music_info.sh
$wall =  /home/ev/Pictures/Wallpapers/toh2.png

general {
    immediate_render = true
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = false
    hide_cursor = false
    transparent = true
}

# BACKGROUND
background {
    path = $wall
    blur_passes = 0
}

# Time (Hours - Mauve)
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color = rgb(203, 166, 247)
    font_size = 60
    font_family = TeachingPrintDotted-OVKlp
    position = -60, 400
    halign = center
    valign = center
}

# Time (Minutes - Pink)
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +":%M")</span>"
    color = rgb(245, 194, 231)
    font_size = 60
    font_family = TeachingPrintDotted-OVKlp
    position = 45, 400
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgb(205, 214, 244)
    font_size = 19
    font_family = TeachingPrintDotted-OVKlp
    position = 0, 340
    halign = center
    valign = center
}

# Profile Photo
image {
    monitor =
    path = ~/.config/hyprlock/pfp.jpg
    border_size = 2
    border_color = rgba(203, 166, 247, 1)
    size = 190
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = -100, 0
    halign = right
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 200, 50
    color = rgba(49, 50, 68, 0.85)
    rounding = 15
    border_size = 2
    border_color = rgba(203, 166, 247, 0.8)
    rotate = 0
    xray = false
    position = -100, -250
    halign = right
    valign = center
}

# USER
label {
    monitor =
    text = cmd[update:60000] echo "<i> Good $(H=$(date +%H); if [ $H -lt 12 ]; then echo Morning; elif [ $H -lt 18 ]; then echo Afternoon; else echo Evening; fi) $(echo "${USER:0:1}" | tr '[:lower:]' '[:upper:]')$(echo "${USER:1}" | tr '[:upper:]' '[:lower:]') </i>" 
    color = rgba(205, 214, 244, 0.95)
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 11
    position = -110, -250
    halign = right
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(203, 166, 247, 0.8)
    inner_color = rgba(49, 50, 68, 0.85)
    font_color = rgba(205, 214, 244, 1)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##cdd6f499">   Enter passwd</span></i>
    hide_input = false
    position = -100, -335
    halign = right
    valign = center
    rounding = 15
}

# Music background card
shape {
    monitor =
    size = 375, 140
    color = rgba(49, 50, 68, 0.85)
    rounding = 30
    border_size = 1
    border_color = rgba(203, 166, 247, 0.5)
    rotate = 0
    position = -30, -50
    halign = right
    valign = top
    zindex = 1
}

# Album art
image {
    monitor =
    path = /tmp/lollypop-cover.png
    size = 100
    rounding = 15
    rotate = 0
    reload_time = 1
    reload_cmd = $music --cover
    position = -45, -70
    halign = right
    valign = top
    zindex = 5
}

# PLAYER SOURCE
label {
    monitor =
    text = cmd[update:1000] $music --source
    color = rgba(186, 194, 222, 0.8)
    font_size = 10
    font_family = Nunito
    position = -160, -65
    halign = right
    valign = top
    zindex = 5
}

# PLAYER TITLE
label {
    monitor =
    text = cmd[update:1000] $music --title
    color = rgba(205, 214, 244, 0.95)
    font_size = 11
    font_family = Nunito Bold
    position = -160, -85
    halign = right
    valign = top
    zindex = 5
}

# PLAYER ARTIST
label {
    monitor =
    text = cmd[update:1000] $music --artist
    color = rgba(186, 194, 222, 0.8)
    font_size = 10
    font_family = Nunito
    position = -160, -105
    halign = right
    valign = top
    zindex = 5
}

# PREVIOUS BUTTON
label {
    monitor =
    text = ⟲
    onclick = playerctl -p Lollypop,spotify,%any previous && $music --cover
    color = rgb(203, 166, 247)
    font_size = 18
    font_family = Nunito
    position = -340, -145
    halign = right
    valign = top
    zindex = 5
}

# PLAY/PAUSE BUTTON
label {
    monitor =
    text = cmd[update:1000] $music --status
    onclick = playerctl -p Lollypop,spotify,%any play-pause && $music --cover
    color = rgb(245, 194, 231)
    font_size = 16
    font_family = Nunito
    position = -295, -145
    halign = right
    valign = top
    zindex = 5
}

# NEXT BUTTON
label {
    monitor =
    text = »
    onclick = playerctl -p Lollypop,spotify,%any next && $music --cover
    color = rgb(203, 166, 247)
    font_size = 18
    font_family = Nunito
    position = -250, -140
    halign = right
    valign = top
    zindex = 5
}
# Weather div
shape {
    monitor =
    size = 140, 80
    color = rgba(49, 50, 68, 0.85)
    rounding = 20
    border_size = 1
    border_color = rgba(245, 194, 231, 0.5)
    rotate = 0
    position = -30, -205
    halign = right
    valign = top
    xray = false
    zindex = 1
}

# WEATHER
label {
    monitor =
    text = cmd[update:1000] echo "$($weather)"
    color = rgb(205, 214, 244)
    font_size = 10
    font_family = Nunito Bold
    position = -45, -218
    halign = right
    valign = top
    zindex = 5
}

# LOCATION
label {
    monitor =
    text = cmd[update:1000] echo "$($location)"
    color = rgb(186, 194, 222)
    font_size = 10
    font_family = Nunito Bold
    position = -50, -248
    halign = right
    valign = top
    zindex = 5
}