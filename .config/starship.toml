"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](bg:#45475a fg:#45475a)\
$os\
$username\
[](bg:#cba6f7 fg:#45475a)\
$directory\
[](bg:#f5c2e7 fg:#cba6f7)\
$git_branch\
$git_status\
[](bg:#313244 fg:#f5c2e7)\
$time\
[ ](fg:#313244)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

[username]
show_always = true
style_user = "bg:#45475a fg:#cdd6f4"
style_root = "bg:#f38ba8 fg:#1e1e2e"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:#45475a fg:#cdd6f4"
disabled = true

[directory]
style = "bg:#cba6f7 fg:#1e1e2e"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#f5c2e7 fg:#1e1e2e"
format = '[ $symbol $branch]($style)'

[git_status]
style = "bg:#f5c2e7 fg:#1e1e2e"
format = '[ $all_status$ahead_behind ]($style)'

[c]
symbol = " "
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#94e2d5 fg:#1e1e2e"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
